name: Metrics

on:
  schedule:
    - cron: "0 18 * * *"   # 01:00 ICT ทุกวัน
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Coding habits
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics-habits.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: pitchakorn-pkt
          base: ""
          config_timezone: Asia/Bangkok
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          extras_css: |
            body { background: #080F21; color: #8E9BC8; }
            h2, .title { color: #EEF0FF; }
            svg { border-color: #22305A; }
            a { color: #7E95FF; }
