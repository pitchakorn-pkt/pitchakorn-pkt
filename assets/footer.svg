<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="1000" height="170" role="img" aria-label="Let's build something that beeps">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08050B"/>
      <stop offset="100%" stop-color="#150D1C"/>
    </linearGradient>
    <radialGradient id="fglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7AC6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF7AC6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9B6BFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF7AC6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9B6BFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="fsoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="992" height="162" rx="22" fill="url(#fbg)"/>
  <ellipse cx="500" cy="180" rx="330" ry="90" fill="url(#fglow)" filter="url(#fsoft)"/>
  <rect x="4.5" y="4.5" width="991" height="161" rx="22" fill="none" stroke="#3A2A42"/>
  <rect x="300" y="52" width="400" height="1.5" fill="url(#frule)"/>
  <g text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="500" y="98" font-size="20" fill="#F0D9EC">Let's build something that beeps</text>
    <text x="500" y="128" font-size="12.5" letter-spacing="3.5" fill="#8E7C99">OPEN TO INTERNSHIPS · IoT &amp; EDGE AI</text>
