<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 140" width="460" height="140" role="img" aria-label="Embedded / AIoT Developer">
  <defs>
    <linearGradient id="ibg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#170E1E"/><stop offset="100%" stop-color="#0D0812"/>
    </linearGradient>
    <radialGradient id="iglow" cx="50%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#FF7AC6" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#FF7AC6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="irule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF7AC6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF7AC6" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#FF7AC6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="458" height="138" rx="18" fill="url(#ibg)" stroke="#3A2A42"/>
  <ellipse cx="230" cy="140" rx="200" ry="52" fill="url(#iglow)"/>

  <g text-anchor="middle">
    <text x="230" y="52" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="19" font-weight="700" fill="#F4ECF7">Embedded / AIoT Developer</text>

    <rect x="180" y="68" width="100" height="1.5" fill="url(#irule)"/>

    <text x="230" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="14.5" letter-spacing="1" fill="#E9A8D9">if it blinks, it works</text>

  </g>
